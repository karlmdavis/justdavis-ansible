# Drop-in on the networkd unit netplan generates for br-lan (netplan has no key for this).
#
# The LAN router's DHCP lease names public resolvers as its DNS servers, and networkd would by
# default add a host route to each of them via the LAN router, so anything eddings sends to those
# addresses (the monitoring role's WAN probes among it) would cross the home LAN instead of leaving
# by br-wan. The lease's DNS servers themselves stay in use: eddings' resolver (systemd-resolved)
# still has them on br-lan, and with br-wan unplugged the lease's default route carries the queries.
[DHCPv4]
RoutesToDNS=no
