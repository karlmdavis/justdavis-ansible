##
# Lets Claude Code act on `@claude` mentions in issues, PR comments, and PR reviews (answer questions,
# implement requested changes, push commits). Configuration follows
# https://code.claude.com/docs/en/github-actions; authentication is the repo secret `CLAUDE_CODE_OAUTH_TOKEN`.
##
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# One Claude task at a time per issue or PR; later mentions wait rather than cancelling work in progress.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required for the action's GitHub App token exchange.
      id-token: write
      # Lets Claude read CI results on PRs.
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Caps runaway tasks; a mention that needs more can be split into follow-ups.
          claude_args: |
            --max-turns 75
