---

# This MUST NOT be done in production, but is required for the tests to work.
- name: Trust Let's Encrypt Staging CA
  ansible.builtin.get_url:
    url: 'https://letsencrypt.org/certs/fakelerootx1.pem'
    dest: '/usr/local/share/ca-certificates/fakelerootx1.crt'
    owner: root
    group: staff
    mode: u=rw,g=r,o=r
  register: download_staging_ca_result
  become: true
  when: is_test

- name: Update CA Certificates Index
  ansible.builtin.command:
    cmd: /usr/sbin/update-ca-certificates
  when: download_staging_ca_result.changed
  become: true

# Apache may have been reloaded by a handler at the end of the role, so make sure the configuration that is
# checked below is the one that is running.
- name: Flush Handlers Before Testing Apache
  ansible.builtin.meta: flush_handlers

# The intranet site exists on every deploy and the dns_server role has already made its name resolve. Its
# document root is empty, so a 403 is the normal answer; the headers are what matters here.
- name: Fetch the Intranet Site Over HTTPS
  ansible.builtin.uri:
    url: "https://intranet.{{ domain }}/"
    status_code: [200, 403, 404]
    return_content: false
  register: apache_test_intranet
  check_mode: false

- name: Assert the Shared Security Headers Are Set
  ansible.builtin.assert:
    that:
      - apache_test_intranet.x_content_type_options == 'nosniff'
      - apache_test_intranet.referrer_policy == 'strict-origin-when-cross-origin'
      - apache_test_intranet.server == 'Apache'
    fail_msg: >-
      Expected nosniff, strict-origin-when-cross-origin and a bare 'Apache' Server header; got:
      {{ apache_test_intranet | to_nice_json }}

# The shared SSL configuration allows TLS 1.2 and 1.3 with AEAD ciphers only. A TLS 1.2 handshake that offers
# only CBC ciphers must be refused by the server (the client's OpenSSL still permits them, so the refusal
# cannot come from the client side), and a default handshake must land on TLS 1.3. One CBC suite is offered
# for each certificate type, so the result does not depend on whether the certificate is ECDSA or RSA.
- name: Offer Only CBC Ciphers Over TLS 1.2
  ansible.builtin.command:
    cmd: >-
      openssl s_client -connect intranet.{{ domain }}:443 -servername intranet.{{ domain }}
      -tls1_2 -cipher ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256
    stdin: ""
  register: apache_test_cbc
  failed_when: false
  changed_when: false
  check_mode: false

- name: Connect With the Default TLS Settings
  ansible.builtin.command:
    cmd: "openssl s_client -connect intranet.{{ domain }}:443 -servername intranet.{{ domain }}"
    stdin: ""
  register: apache_test_tls_default
  changed_when: false
  check_mode: false

- name: Assert the TLS Profile Is Enforced
  ansible.builtin.assert:
    that:
      - apache_test_cbc.rc != 0
      - "'handshake failure' in apache_test_cbc.stderr"
      - "'TLSv1.3' in apache_test_tls_default.stdout"
    fail_msg: >-
      Expected the CBC-only handshake to fail with a handshake-failure alert (rc={{ apache_test_cbc.rc }},
      stderr: {{ apache_test_cbc.stderr }}) and the default handshake to use TLS 1.3 (got:
      {{ apache_test_tls_default.stdout | regex_search('Protocol *: *[^\n]+') }}).
