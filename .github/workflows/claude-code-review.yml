##
# Automated review of every pull request by Claude Code, using the official `code-review` plugin (the same
# skill as the local `/code-review` command). Findings are posted as inline comments on the offending
# lines, with a summary comment only when nothing is found; drafts and trivial PRs are skipped by the
# skill itself. Configuration follows https://code.claude.com/docs/en/github-actions.
#
# Authentication is the repo secret `CLAUDE_CODE_OAUTH_TOKEN`, minted with `claude setup-token` (expires
# after about a year). On public repositories GitHub withholds secrets from fork PRs, so only PRs from
# branches in this repository are reviewed.
##
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the same PR cancels the review still running for the previous push.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required for the action's GitHub App token exchange.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # `--comment` makes the skill post its findings on the PR instead of only in the run log.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The inline-comment MCP server only starts when `--allowedTools` names it, even though the
          # skill's own frontmatter allows the same tool. The skill fans out to subagents (`Agent`) and
          # reads the PR with `gh`; runs with only the MCP tool allowed ended on a permission denial, so
          # the skill's frontmatter tools are repeated here explicitly. `--max-turns` caps runaway reviews.
          # Temporary while diagnosing why reviews post nothing: prints Claude's transcript (including the
          # denied tool) into the public job log. Remove once the allow list is settled.
          show_full_output: true
          claude_args: |
            --max-turns 50
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
