---
# Smoke tests for the monitoring stack: the service is up, the three web services answer, Prometheus
# can scrape every exporter, and every container is running. Prometheus reaching "ready" implies its
# configuration and rule files loaded, and anything an alert rule already covers (exporter health,
# probe results, device reachability) is deliberately not re-tested here.
#
# This file is imported unconditionally (the `test` tag only allows opting in with `--tags`), so it
# runs in production too and every check must hold on a healthy long-running system, not just a fresh
# one.

- name: Meta - flush_handlers
  ansible.builtin.meta: flush_handlers

- name: Test - Verify Monitoring Service is Running
  ansible.builtin.systemd_service:
    name: monitoring
  register: monitoring_service_status
  failed_when: monitoring_service_status.status.ActiveState != "active"
  become: true

- name: Test - Wait for Prometheus Readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_prometheus_port }}/-/ready"
    status_code: 200
  register: monitoring_prometheus_ready
  until: monitoring_prometheus_ready.status == 200
  retries: 60
  delay: 2

- name: Test - Wait for Grafana Health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/health"
    status_code: 200
  register: monitoring_grafana_health
  until: monitoring_grafana_health.status == 200
  retries: 60
  delay: 2

- name: Test - Wait for Alertmanager Readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_alertmanager_port }}/-/ready"
    status_code: 200
  register: monitoring_alertmanager_ready
  until: monitoring_alertmanager_ready.status == 200
  retries: 30
  delay: 2

# The one path worth checking explicitly: Prometheus on the bridge network reaching the host-network
# exporters through the bridge gateway address and the ufw rule, which is easy to break. The
# `airplay_tcp` job is dynamic (it only has targets while a tracked HomePod is associated), so it is
# not required here.
- name: Test - Wait for All Prometheus Targets to be Up
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_prometheus_port }}/api/v1/targets?state=active"
    return_content: true
  register: monitoring_targets
  until: >-
    (monitoring_targets.json.data.activeTargets | map(attribute='health') | unique | list) == ['up']
    and (['airplay', 'alertmanager', 'amplifi', 'blackbox', 'gateway', 'node', 'ping', 'prometheus']
         | difference(monitoring_targets.json.data.activeTargets | map(attribute='labels.job') | unique))
        == []
  retries: 30
  delay: 5

- name: Test - List Monitoring Containers
  ansible.builtin.command:
    cmd: /usr/bin/docker compose ps --all --quiet
    chdir: "{{ monitoring_base_dir }}"
  register: monitoring_container_ids
  changed_when: false
  check_mode: false
  become: true

- name: Test - Inspect Monitoring Containers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - inspect
      - --format
      # The assertions below key on field position; keep RestartCount last.
      - "{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}.State.Status{{ '}}' }} {{ '{{' }}.RestartCount{{ '}}' }}"
      - "{{ item }}"
  loop: "{{ monitoring_container_ids.stdout_lines }}"
  register: monitoring_container_states
  changed_when: false
  check_mode: false
  become: true

# One container per service in docker-compose.yml.j2; update the count here and below (and the
# stop-timeout note in monitoring.service.j2) when a service is added.
- name: Test - Verify Every Container is Running
  ansible.builtin.assert:
    that:
      - monitoring_container_ids.stdout_lines | length == 9
      - monitoring_container_states.results | map(attribute='stdout') | select('search', ' running ')
        | list | length == 9
    fail_msg: "{{ monitoring_container_states.results | map(attribute='stdout') | list }}"

# A single historical crash must not fail every future production run, so restart counts are only
# asserted on a fresh test system.
- name: Test - Verify No Container Has Restarted (test only)
  ansible.builtin.assert:
    that:
      - monitoring_container_states.results | map(attribute='stdout') | select('search', ' 0$')
        | list | length == 9
    fail_msg: "{{ monitoring_container_states.results | map(attribute='stdout') | list }}"
  when: is_test

# `promtool check rules` (run when the rules are templated) checks only that the rules parse. These
# feed the rules made-up series and check what they record and which alerts fire. They need no data
# from the network, so they hold on any system.
#
# The recording rules are tested as deployed. The alert rules are rendered again, with the device
# groups included, because the test environment deploys them without: this is the only place the
# device rules are rendered, parsed, or exercised before they reach production.
- name: Test - Rule Unit Tests
  become: true
  vars:
    monitoring_rule_unit_tests:
      - recording_test.yml
      - alerts_airplay_test.yml
      - alerts_docsis_test.yml
      - alerts_playback_state_test.yml
  block:
    - name: Test - Create Directory for Rule Unit Tests
      ansible.builtin.tempfile:
        state: directory
        suffix: .monitoring-rules-test
      register: monitoring_rules_test_dir
      changed_when: false
      check_mode: false

    - name: Test - Copy Rule Unit Tests
      ansible.builtin.copy:
        src: "prometheus/{{ item }}"
        dest: "{{ monitoring_rules_test_dir.path }}/{{ item }}"
        mode: 'u=rw,g=r,o=r'
      loop: "{{ monitoring_rule_unit_tests }}"
      changed_when: false
      check_mode: false

    - name: Test - Render Alert Rules With Device Groups Beside Unit Tests
      ansible.builtin.template:
        src: alerts.yml.j2
        dest: "{{ monitoring_rules_test_dir.path }}/alerts.yml"
        mode: 'u=rw,g=r,o=r'
      vars:
        monitoring_alerts_include_device_rules: true
      changed_when: false
      check_mode: false

    - name: Test - Copy Deployed Recording Rules Beside Unit Test
      ansible.builtin.copy:
        src: "{{ monitoring_base_dir }}/prometheus/recording.yml"
        dest: "{{ monitoring_rules_test_dir.path }}/recording.yml"
        remote_src: true
        mode: 'u=rw,g=r,o=r'
      changed_when: false
      check_mode: false

    - name: Test - Run Rule Unit Tests
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/bin/docker', 'run', '--rm', '--user', '0', '--entrypoint', 'promtool',
             '--volume', monitoring_rules_test_dir.path ~ ':/rules-test:ro',
             '--workdir', '/rules-test', monitoring_prometheus_image, 'test', 'rules']
            + monitoring_rule_unit_tests
          }}
      changed_when: false
      check_mode: false
  always:
    - name: Test - Remove Directory for Rule Unit Tests
      ansible.builtin.file:
        path: "{{ monitoring_rules_test_dir.path }}"
        state: absent
      changed_when: false
      check_mode: false
      when: monitoring_rules_test_dir.path is defined
