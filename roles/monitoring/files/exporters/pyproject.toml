[project]
name = "justdavis-monitoring-exporters"
version = "0.1.0"
description = "Prometheus exporters for the justdavis.com home network: AmpliFi router, Comcast gateway, AirPlay mDNS."
requires-python = ">=3.13"
dependencies = [
    "prometheus-client==0.26.0",
    "requests==2.34.2",
    "zeroconf==0.151.3",
]

[project.scripts]
amplifi-exporter = "justdavis_monitoring_exporters.amplifi.main:main"
gateway-exporter = "justdavis_monitoring_exporters.gateway.main:main"
airplay-exporter = "justdavis_monitoring_exporters.airplay.main:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justdavis_monitoring_exporters"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
