---
# Defaults for the monitoring role. Production-specific values (hosts, tracked clients, ping targets)
# live in host_vars/eddings.justdavis.com/main.yml and the vault; these defaults describe a stack that
# runs anywhere (including the AWS test instance) with the device scrapers in their "not configured"
# state.

monitoring_base_dir: /opt/monitoring
monitoring_user: monitoring

# Pre-created bridge network with a fixed subnet, so that host-network containers can bind their
# metrics endpoints to the bridge gateway address (reachable by Prometheus on the bridge, but not from
# the LAN). Same pattern as the Immich network / PostgreSQL rule. The subnet deliberately avoids
# 172.31.0.0/16, which is the AWS default VPC range the test instances live in.
monitoring_docker_network: monitoring_default
monitoring_docker_subnet: 172.28.0.0/24
monitoring_docker_gateway: 172.28.0.1

# Image versions. Bump deliberately, in a PR gated by the AWS test run.
monitoring_prometheus_image: prom/prometheus:v3.14.0
monitoring_grafana_image: grafana/grafana-oss:13.0.2
# Alertmanager >= 0.26 is required for `webhook_url_file` on the Discord receiver.
monitoring_alertmanager_image: prom/alertmanager:v0.34.0
monitoring_blackbox_image: prom/blackbox-exporter:v0.28.0
monitoring_node_exporter_image: prom/node-exporter:v1.12.1
monitoring_ping_exporter_image: czerwonk/ping_exporter:1.2.3
# Built locally from roles/monitoring/files/exporters by the `Build Monitoring Exporters` handler.
monitoring_exporters_image: justdavis-monitoring-exporters:local

# Ports. Bridge-network services publish on 127.0.0.1 only; host-network exporters bind the bridge
# gateway address.
monitoring_prometheus_port: 9090
monitoring_grafana_port: 3000
monitoring_alertmanager_port: 9093
monitoring_blackbox_port: 9115
monitoring_node_exporter_port: 9100
monitoring_ping_exporter_port: 9427
monitoring_amplifi_exporter_port: 9801
monitoring_gateway_exporter_port: 9802
monitoring_airplay_exporter_port: 9803

# Prometheus keeps as much history as fits in this much disk (no time-based cap). At the projected
# ~0.5-1.5 GB/month this is roughly 4-12 months.
monitoring_prometheus_retention_size: 6GB
monitoring_scrape_interval: 15s
monitoring_evaluation_interval: 30s
monitoring_prometheus_mem_limit: 1g
monitoring_grafana_mem_limit: 512m

# Device scrapers. An empty host means "not configured": the exporter serves `<name>_up 0` and idles.
monitoring_amplifi_host: ''
monitoring_amplifi_interval_seconds: 30
monitoring_amplifi_mesh_point_count: 0
monitoring_gateway_host: ''
monitoring_gateway_interval_seconds: 60
# Minimum seconds between gateway re-logins, so a person using the gateway GUI is not logged out
# every poll (the gateway allows a single admin session).
monitoring_gateway_relogin_min_seconds: 300
monitoring_airplay_interval_seconds: 30
monitoring_airplay_resolve_timeout_ms: 3000

# Continuous ping settings (ping_exporter): one packet per second per target, loss and jitter over
# a 60-sample window.
monitoring_ping_interval_seconds: 1
monitoring_ping_timeout_seconds: 2
monitoring_ping_history_size: 60

# Devices to track by MAC: list of {mac, name, kind, airplay_name (optional)}; kind is one of
# homepod, appletv, ipad, phone, laptop, other. Production keeps this in the vault (public repo).
monitoring_tracked_clients: []

# Always-pinged addresses. Production adds the router, gateway, and ISP first hop in host_vars.
monitoring_static_ping_targets:
  - 1.1.1.1
  - 8.8.8.8
# The target whose loss/latency/jitter represent "the internet" in alert rules.
monitoring_wan_probe_target: 1.1.1.1

# Alert thresholds, from video-conferencing and DOCSIS guidance (see README).
monitoring_alert_wan_loss_ratio: 0.05
monitoring_alert_wan_latency_seconds: 0.1
monitoring_alert_wan_jitter_seconds: 0.03
monitoring_alert_docsis_snr_min_db: 33
monitoring_alert_docsis_power_max_dbmv: 12
monitoring_alert_docsis_power_min_dbmv: -8
monitoring_alert_docsis_uncorrectable_increase_15m: 1000
monitoring_alert_reboot_uptime_seconds: 600

monitoring_grafana_root_url: "https://grafana.intranet.{{ domain }}/"

# Slack channel that alerts are posted to by the "Home Monitoring" bot (see README).
monitoring_slack_channel: '#home-alerts'
