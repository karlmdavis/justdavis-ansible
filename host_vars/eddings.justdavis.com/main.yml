---
zfs_ssd_pool_device: /dev/sda1

backup_includes:
  - /home
  - /var/fileshares
  - /var/vmail
  - /var/lib/amavis
  - /etc/letsencrypt
  - /var/apache2
  - /var/lib/tomcat8
  - /var/log/tomcat8
  - /var/lib/postgresql/backups
  # Configuration for the arr suite containers (their media lives under /var/fileshares).
  - /opt/arr_suite/config

backup_excludes:
  - /var/fileshares/justdavis.com/groups/media/movies
  - /var/fileshares/justdavis.com/groups/media/tv-shows
  - /var/fileshares/justdavis.com/groups/media/music-videos
  - /var/fileshares/justdavis.com/groups/sysadmin/archives

# Home network monitoring (roles/monitoring). The tracked-client list (device names and MACs) lives in
# the vault because this repository is public.
monitoring_amplifi_host: 10.0.0.1
monitoring_amplifi_mesh_point_count: 2
monitoring_gateway_host: 10.1.10.1
monitoring_tracked_clients: "{{ vault_monitoring_tracked_clients }}"
# Layered ping targets, from the LAN outwards: AmpliFi router (LAN and WAN sides), Comcast gateway
# (LAN and static-IP sides), the ISP's first hop, and two public anchors.
monitoring_static_ping_targets:
  - 10.0.0.1
  - 96.86.32.141
  - 10.1.10.1
  - 96.86.32.142
  - 69.140.0.1
  - 1.1.1.1
  - 8.8.8.8
