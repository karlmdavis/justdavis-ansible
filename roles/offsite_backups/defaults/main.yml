---

##
# Defaults for the `offsite_backups` role (restic to Backblaze B2). Only what differs between test and
# production, or must come from the vault, is a variable; policy knobs (retention, schedules, check sample)
# are literals in the templates that use them. See the role README.
##

# Where the encrypted repository lives: a per-host path inside the `justdavis-offsite-backups` B2 bucket
# in production, a local directory in the AWS tests (so tests need no credentials).
offsite_backups_repository: >-
  {{ '/var/tmp/offsite-backups-test-repo' if is_test
     else 'b2:justdavis-offsite-backups:' ~ inventory_hostname_short }}

# Secrets. Production values come from the vault; tests use fixed throwaway values.
offsite_backups_restic_password: >-
  {{ 'offsite-backups-test-password' if is_test else vault_offsite_backups_restic_password }}
offsite_backups_b2_key_id: "{{ '' if is_test else vault_offsite_backups_b2_key_id }}"
offsite_backups_b2_key: "{{ '' if is_test else vault_offsite_backups_b2_key }}"

# The paths to back up and the patterns to exclude come from the existing per-host `backup_includes`
# and `backup_excludes` variables (inherited from the former `tarsnap` role).
