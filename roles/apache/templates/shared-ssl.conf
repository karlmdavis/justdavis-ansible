##
# Configures Apache's SSL engine per Mozilla's "intermediate" profile (guidelines version 5.7), which is the
# recommended profile for a general-purpose public site: TLS 1.2 and 1.3 only, AEAD ciphers only (no CBC),
# forward secrecy throughout, and no server-side cipher ordering because every allowed suite is considered
# strong. Generated for Apache 2.4.58 with OpenSSL 3.0.13, the versions on eddings (Ubuntu 24.04):
# https://ssl-config.mozilla.org/#server=apache&version=2.4.58&config=intermediate&openssl=3.0.13&hsts=false&guideline=5.7
#
# HSTS is deliberately not set here: it is a per-site decision, made in each virtual host.
##

SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLOpenSSLConfCmd       Curves X25519:prime256v1:secp384r1
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder     off
SSLCompression          off
SSLSessionTickets       off

# OCSP stapling is off: Let's Encrypt stopped including OCSP responder URLs in its certificates in 2025, so
# with stapling on, Apache logged "no OCSP URI in certificate" errors at every reload and stapled nothing.
SSLUseStapling          off
