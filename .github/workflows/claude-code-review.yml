##
# Automated review of every pull request by Claude Code, using the official `code-review` plugin (the same
# skill as the local `/code-review` command). Findings are posted as inline comments on the offending
# lines plus one summary comment; drafts and trivial PRs are skipped by the skill itself. Cribbed from the
# working workflow in justdavis-family/justdavis, minus its label gate and sticky comment; see also
# https://code.claude.com/docs/en/github-actions.
#
# Authentication is the repo secret `CLAUDE_CODE_OAUTH_TOKEN`, minted with `claude setup-token` (expires
# after about a year). On public repositories GitHub withholds secrets from fork PRs, so only PRs from
# branches in this repository are reviewed.
##
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to the same PR cancels the review still running for the previous push.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Write access is needed to post the review comments.
      pull-requests: write
      issues: read
      # Required for the action's GitHub App token exchange.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Creates a tracking comment on the PR that is updated with the final result, and feeds the PR context
          # to Claude. Without it, Claude's final text goes only to the run log.
          track_progress: true
          # `--comment` makes the skill post its findings on the PR instead of only in the run log. The extra
          # instructions ask for inline comments plus one summary comment every time, since the skill alone
          # stays silent on a PR where nothing scores as a definite issue.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Submit the review as one or more inline comments plus a single PR comment:
            - For specific code issues, use the mcp__github_inline_comment__create_inline_comment tool to post
              inline comments on the relevant lines in the diff.
            - The PR comment should briefly summarize the overall review, tie any inline comments together, and
              say so plainly when nothing needs changing.

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and concise.
          # Everything the review needs must be allowed here; in automation mode nothing else is granted, and
          # the plugin's frontmatter is not applied on its own (verified from a transcript, 2026-09-17):
          # - `Skill` runs the `/code-review:code-review` invocation itself; without it the plugin never starts.
          # - `Agent` runs the plugin's pre-check and parallel reviewer subagents.
          # - `Read`/`Glob`/`Grep` let it read the diff and CLAUDE.md files without shell pipelines, which the
          #   `Bash(gh ...)` rules do not cover.
          # - The `gh pr`/`gh issue` commands are the plugin frontmatter's own list.
          # - The inline-comment MCP server only starts when named here.
          # `--max-turns` caps runaway reviews.
          claude_args: |
            --max-turns 50
            --allowedTools "Skill,Agent,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
