---
##
# Install Jellyfin per their manual-install-via-APT instructions at
# <https://jellyfin.org/docs/general/installation/linux/#debuntu-debian-ubuntu-and-derivatives-using-apt>.
##

- name: Add universe APT Repo
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
    state: present
  become: true

- name: Add Jellyfin APT Key and Repo
  block:
    - name: Add Jellyfin APT Signing Key
      ansible.builtin.get_url:
        url: 'https://repo.jellyfin.org/jellyfin_team.gpg.key'
        dest: /etc/apt/keyrings/jellyfin_team.gpg.key
      become: true

    - name: Add Jellyfin APT Repo
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ [ansible_architecture] | map('extract', deb_architecture) | first }} signed-by=/etc/apt/keyrings/jellyfin_team.gpg.key] https://repo.jellyfin.org/ubuntu {{ ansible_facts['distribution_release'] }} main"
        state: present
      vars:
        deb_architecture: {
          "aarch64": "arm64",
          "x86_64": "amd64"
        }
      become: true

# Installs the `jellyfin` metapackage, deliberately unpinned and never upgraded here:
# - The metapackage (not `jellyfin-server`) is what depends on the matching `jellyfin-ffmpegN` package, so
#   installing it is what swaps ffmpeg when a major release moves to a new one (12.x: ffmpeg7 -> ffmpeg8).
# - `state: present` leaves an installed version alone. Jellyfin majors run a one-way database migration
#   on first start (no downgrade without a restore), so upgrades are a deliberate manual step; the
#   procedure is in README.md. Unattended-upgrades does not touch this repository either (see the base
#   role's 50unattended-upgrades.j2).
- name: Add Jellyfin APT Package
  ansible.builtin.package:
    name:
      - curl
      - gnupg
      - jellyfin
    state: present
  become: true

# Jellyfin Firewall Configuration.
#
# Goal: Restrict media server access to trusted networks only.
#
# Reasoning:
# - Port 8096: Direct access to Jellyfin web interface and streaming.
# - Currently NOT proxied through Apache (see GitHub issue #35).
# - Media content should only be accessible to family members, not the public internet.
#
# Tradeoffs:
# - Users can only stream media from LAN or Tailscale VPN (not directly from internet).
# - This is acceptable for a private family media server.
# - Remote streaming requires connecting to Tailscale VPN first (adds one extra step).
#
# Security benefit: Prevents unauthorized access to media library and reduces attack surface.
# Future improvement: Proxy through Apache (like other intranet services) to allow localhost-only
# binding and centralized TLS termination.
- name: Firewall - Allow Jellyfin from LAN and Tailscale
  community.general.ufw:
    rule: allow
    port: '8096'
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Jellyfin - {{ 'LAN' if item == network_home_private_cidr else 'Tailscale' }}"
  become: true
  loop:
    - "{{ network_home_private_cidr }}"
    - "{{ network_tailscale_cidr }}"

##
# Database copy for the offsite backup.
#
# Jellyfin's state (users, libraries, watched status, progress, hand-corrected matches) is one SQLite
# database in WAL mode, and Jellyfin's documentation only allows copying it with the server stopped.
# SQLite's online backup API gives a consistent snapshot without a stop, so a daily timer writes one to
# /var/backups/jellyfin and the host's `backup_includes` picks that up (and excludes the live file).
# Same shape as the PostgreSQL role's dump timer. See README.md, "Backups".
##

- name: Create Jellyfin Database Dump Directory
  ansible.builtin.file:
    path: /var/backups/jellyfin
    state: directory
    owner: jellyfin
    group: jellyfin
    mode: u=rwx,g=,o=
  become: true

- name: Install Jellyfin Database Dump Script
  ansible.builtin.copy:
    src: jellyfin-db-dump.py
    dest: /usr/local/bin/jellyfin-db-dump.py
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  become: true

- name: Install Jellyfin Database Dump Unit and Timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  loop:
    - jellyfin-db-dump.service
    - jellyfin-db-dump.timer

- name: Enable and Start Jellyfin Database Dump Timer
  ansible.builtin.systemd:
    name: jellyfin-db-dump.timer
    state: started
    enabled: true
    daemon_reload: true
  become: true
