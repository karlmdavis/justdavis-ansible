---
zfs_ssd_pool_device: /dev/sda1

# Jellyfin was upgraded by hand to 12.4 (procedure in roles/jellyfin/README.md). With this set, the role's
# tests fail if a restore or a rebuild ever brings an older version back.
jellyfin_min_version: '12.4'

backup_includes:
  - /home
  - /var/fileshares
  - /var/vmail
  - /var/lib/amavis
  - /etc/letsencrypt
  - /var/apache2
  - /var/lib/tomcat8
  - /var/log/tomcat8
  - /var/lib/postgresql/backups
  # Configuration for the arr suite containers (their media lives under /var/fileshares).
  - /opt/arr_suite/config
  # Jellyfin: configuration, library definitions, plugin settings, and the data directory minus the live
  # database and its regenerable subdirectories (both excluded below); the consistent daily copy of the
  # database lives in /var/backups/jellyfin. Not included: metadata/ (4 GB of re-fetchable artwork) and
  # transcodes/ (scratch). See roles/jellyfin.
  - /etc/jellyfin
  - /var/lib/jellyfin/root
  - /var/lib/jellyfin/plugins
  - /var/lib/jellyfin/data
  - /var/backups/jellyfin

backup_excludes:
  - /var/fileshares/justdavis.com/groups/media/movies
  - /var/fileshares/justdavis.com/groups/media/tv-shows
  - /var/fileshares/justdavis.com/groups/media/music-videos
  - /var/fileshares/justdavis.com/groups/sysadmin/archives
  # The live Jellyfin database (and its -wal/-shm files) is not safe to copy while the server runs; the
  # jellyfin-db-dump timer writes a consistent copy to /var/backups/jellyfin instead.
  - /var/lib/jellyfin/data/jellyfin.db*
  # Regenerable or redundant parts of the data directory: trickplay/ (scrubbing previews, many GB once
  # enabled), SQLiteBackups/ (the copies the migrator takes before an upgrade) and backups/ (zips from the
  # built-in backup feature in the dashboard). Subtitles, playlists and scheduled-task triggers stay in.
  - /var/lib/jellyfin/data/trickplay
  - /var/lib/jellyfin/data/SQLiteBackups
  - /var/lib/jellyfin/data/backups
