##
# Replaces the apache2 package's /etc/apache2/conf-available/security.conf (which is enabled by default and
# sets `ServerTokens OS` and `ServerSignature On`). Ubuntu's version is kept as a dpkg conffile, so a package
# upgrade leaves this file in place.
##

# Say "Apache", not "Apache/2.4.58 (Ubuntu)", in the Server header and in generated error pages. Version
# disclosure is not a vulnerability, but it is free reconnaissance for scanners.
ServerTokens Prod
ServerSignature Off

# TRACE is not used by anything here and is an old cross-site tracing vector.
TraceEnable Off

# Baseline response headers for every site. `always` makes them apply to error responses too.
# - nosniff: browsers must trust the Content-Type rather than guessing, which blocks a class of
#   content-confusion attacks against uploaded files.
# - Referrer-Policy: send the full URL only to the same origin; cross-origin requests see the origin alone,
#   so URLs with tokens in them (shared links) do not leak through Referer headers.
# Strict-Transport-Security is deliberately not here: HSTS is a per-site decision made in each virtual host.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
