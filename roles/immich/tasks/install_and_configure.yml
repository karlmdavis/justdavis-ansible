---
# Create user and directories following arr_suite pattern

- name: Create Base Directory
  ansible.builtin.file:
    path: "{{ immich_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: 'u=rwx,g=rx,o=rx'
  become: true

- name: Create System User for Application
  ansible.builtin.user:
    name: "{{ immich_user }}"
    state: present
    system: true
    shell: /bin/false
    home: "{{ immich_base_dir }}"
  become: true

- name: Get System User Details
  ansible.builtin.command:
    cmd: "getent passwd {{ immich_user }}"
  register: immich_passwd_entry
  # Pure read-only lookup; run it in check mode too, so the tasks that use its result still work.
  check_mode: false
  changed_when: false

- name: Parse Out UID for System User
  ansible.builtin.set_fact:
    immich_uid: "{{ immich_passwd_entry.stdout.split(':')[2] }}"

- name: Get Media Group Details
  ansible.builtin.command:
    cmd: getent group media_managers
  register: media_managers_group_entry
  # Pure read-only lookup; run it in check mode too, so the tasks that use its result still work.
  check_mode: false
  changed_when: false

- name: Parse Out GID for Media Group
  ansible.builtin.set_fact:
    media_managers_gid: "{{ media_managers_group_entry.stdout.split(':')[2] }}"

- name: Create Upload Directory
  ansible.builtin.file:
    path: /var/fileshares/justdavis.com/groups/media/photos
    state: directory
    owner: "{{ immich_user }}"
    group: media_managers
    mode: 'u=rwx,g=rwx,o=rx'
  become: true

# TODO: Add disk space monitoring/limits for ML model cache (Claude Code Review)
#       Models can be several GB each and could consume significant disk space over time
#       Consider adding disk usage monitoring or TTL-based cleanup
- name: Create Model Cache Directory
  ansible.builtin.file:
    path: "{{ immich_base_dir }}/model-cache"
    state: directory
    owner: "{{ immich_user }}"
    group: media_managers
    mode: 'u=rwx,g=rwx,o=rx'
  become: true

# Pre-create the Immich Docker network to ensure the gateway IP exists before PostgreSQL starts
# This resolves the circular dependency where PostgreSQL needs to bind to 172.30.0.1
# but that IP doesn't exist until Docker Compose creates the network
- name: Create Immich Docker Network
  community.docker.docker_network:
    name: immich_default
    driver: bridge
    ipam_config:
      - subnet: 172.30.0.0/16
        gateway: 172.30.0.1
  become: true
  notify: Restart PostgreSQL

# PostgreSQL Vector Extension Setup
# Note: PostgreSQL APT repository is configured by postgresql_server role

# Install pgvector from PostgreSQL APT repository (prerequisite for VectorChord)
# Immich does not check pgvector's version when VectorChord is in use; the known-good range is in the role
# README. The PostgreSQL APT repository has newer versions than Ubuntu's default.
- name: Install PostgreSQL pgvector Extension
  ansible.builtin.apt:
    name: postgresql-16-pgvector
    state: present
    update_cache: true
  become: true

# Manual installation of VectorChord from GitHub (not available in Ubuntu repository)
# Reference: https://immich.app/docs/administration/postgres-standalone/
# Immich's accepted version range is in the role README.
- name: Download VectorChord Package
  ansible.builtin.get_url:
    url: 'https://github.com/tensorchord/VectorChord/releases/download/0.4.3/postgresql-16-vchord_0.4.3-1_amd64.deb'
    dest: '/usr/local/src/postgresql-16-vchord_0.4.3-1_amd64.deb'
    mode: 'u=rw,g=r,o=r'

# A new vchord.so is only picked up when PostgreSQL restarts (it is in shared_preload_libraries), hence the
# notify.
- name: Install VectorChord Package
  ansible.builtin.apt:
    deb: '/usr/local/src/postgresql-16-vchord_0.4.3-1_amd64.deb'
    update_cache: true
  become: true
  notify: Restart PostgreSQL

- name: Install psycopg2 for System Python
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: true
  become: true

- name: Configure PostgreSQL to Preload vchord.so
  community.postgresql.postgresql_alter_system:
    param: shared_preload_libraries
    value: vchord.so
  become: true
  become_user: postgres
  notify: Restart PostgreSQL

# Force PostgreSQL restart to load the VectorChord extension and start listening on the new Immich
# network
- name: Flush handlers to restart PostgreSQL
  ansible.builtin.meta: flush_handlers

- name: Create PostgreSQL User
  community.postgresql.postgresql_user:
    name: "{{ vault_postgres_immich_username }}"
    password: "{{ vault_postgres_immich_password }}"
    encrypted: true
    state: present
  become: true
  become_user: postgres

- name: Create PostgreSQL Database
  community.postgresql.postgresql_db:
    name: immich
    owner: "{{ vault_postgres_immich_username }}"
    state: present
  become: true
  become_user: postgres

- name: Grant PostgreSQL User Privileges On Database
  community.postgresql.postgresql_privs:
    login_db: immich
    role: "{{ vault_postgres_immich_username }}"
    type: database
    privs: ALL
  become: true
  become_user: postgres

# VectorChord's control file has `superuser = true`, so only a superuser can create or update it; the
# `cascade` pulls in pgvector (`vector`), which it depends on.
- name: Create VectorChord Extension in Immich Database
  community.postgresql.postgresql_ext:
    name: vchord
    login_db: immich
    cascade: true
    state: present
  become: true
  become_user: postgres

# The other extensions Immich expects, created here as `postgres` because the Immich database role below is
# not a superuser and so cannot create them itself (its initial migration only runs
# `CREATE EXTENSION IF NOT EXISTS`, a no-op once they exist). The list and its source are in
# `defaults/main.yml`; `cascade` is for `earthdistance`, which depends on `cube`.
- name: Create Extensions Immich Expects in Immich Database
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    login_db: immich
    cascade: true
    state: present
  loop: "{{ immich_postgres_extensions }}"
  become: true
  become_user: postgres

# Immich expects a superuser by default, but it runs without one as long as the database is owned by its role
# (the database task above) and the extensions are created beforehand (the two tasks above); see the
# "Without superuser permission" section of https://docs.immich.app/administration/postgres-standalone. A
# superuser Immich role would make a compromise of Immich a compromise of every database on the host and of
# the `postgres` operating-system user (`COPY ... PROGRAM`); without it the blast radius is the Immich
# database. Two things change, both documented in the role README: a new VectorChord version must be
# applied by hand (`ALTER EXTENSION vchord UPDATE` plus the two `REINDEX INDEX` commands) because Immich
# can no longer do it on startup, and Immich's built-in database backup job must stay disabled because its
# documentation says it needs a superuser; the host's hourly `pg_dumpall` covers the database anyway.
#
# Restarts Immich so that its startup checks (extension versions, vector index reindexing, prewarming) run
# under the reduced privileges during this run, where the role's tests would catch a failure, rather than at
# some later unattended restart. Registered so that the tests know this run recreated the containers.
- name: Remove Superuser Privileges From Immich User
  community.postgresql.postgresql_user:
    name: "{{ vault_postgres_immich_username }}"
    role_attr_flags: NOSUPERUSER
    state: present
  become: true
  become_user: postgres
  register: immich_db_user_privileges
  notify: Restart Immich

# Docker Compose Configuration

# These two and the privileges task above are the only tasks that notify Restart Immich; their results are
# registered so that the tests know whether this run recreated the containers.
- name: Create Docker Compose File
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'
  become: true
  register: immich_compose_file
  notify: Restart Immich

- name: Create Environment File
  ansible.builtin.template:
    src: env.j2
    dest: "{{ immich_base_dir }}/.env"
    owner: root
    group: root
    mode: 'u=rw,g=r,o='
  become: true
  register: immich_env_file
  notify: Restart Immich

- name: Create Hardware Acceleration Config Files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ immich_base_dir }}/{{ item | replace('.j2', '') }}"
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'
  become: true
  loop:
    - hwaccel.transcoding.yml.j2
    - hwaccel.ml.yml.j2

# Service Management

- name: Deploy Systemd Service for Immich
  ansible.builtin.template:
    src: immich.service.j2
    dest: /etc/systemd/system/immich.service
    owner: root
    group: root
    mode: 'u=rw,g=r,o=r'
  become: true
  notify: Reload Systemd

# Restart Immich now rather than at the end of the play, so that after a version or configuration
# change the role's tests check the new containers instead of the ones about to be replaced. This comes
# before the start task below so that a stopped or newly installed service comes up only once: if the
# start task ran first, the handler's restart moments later would tear the containers down
# mid-migration. The Restart Immich handler reloads systemd first, so a freshly deployed unit file is
# picked up whatever order the handlers run in.
- name: Flush handlers to restart Immich
  ansible.builtin.meta: flush_handlers

- name: Enable and Start Immich Service
  ansible.builtin.systemd:
    name: immich
    state: started
    enabled: true
    daemon_reload: true
  become: true
