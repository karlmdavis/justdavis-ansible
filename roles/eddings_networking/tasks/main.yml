---

##
# Configures the system's networking correctly:
#
# * Create a network bridge on the WAN connection, eno1 (lower 2.5 GB port), for use by VMs.
# * Configure static public IPs on bridge.
# * Configure the LAN connection, eno2 (upper 2.5 GB port), for DHCP.
##

- name: Install Network Bridging Utilities
  ansible.builtin.package:
    name: bridge-utils
    state: present
  become: true

- name: Ignore Routes With Down Links
  ansible.builtin.copy:
    src: sysctl.d/local.conf
    dest: /etc/sysctl.d/local.conf
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  notify:
    - Load Local sysctl Configuration

- name: Configure Network Interfaces
  ansible.builtin.copy:
    src: netplan/00-installer-config.yaml
    dest: /etc/netplan/00-installer-config.yaml
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  notify:
    - Run netplan apply

# Netplan has no setting for RoutesToDNS, so it is set in a drop-in on the unit netplan generates for
# br-lan. The file explains why.
- name: Create Drop-In Directory For br-lan
  ansible.builtin.file:
    path: /etc/systemd/network/10-netplan-br-lan.network.d
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  become: true

- name: Stop Routing The LAN Lease's DNS Servers Via The Router
  ansible.builtin.copy:
    src: systemd/network/10-netplan-br-lan.network.d/routes-to-dns.conf
    dest: /etc/systemd/network/10-netplan-br-lan.network.d/routes-to-dns.conf
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  become: true
  notify:
    - Run netplan apply
