# Drop-in for the systemd-networkd unit that netplan generates for br-lan
# (/run/systemd/network/10-netplan-br-lan.network). Netplan has no key for this setting.
#
# The AmpliFi's DHCP lease names its DNS servers (public resolvers, 1.1.1.1 and 1.0.0.1 as of
# 2026-10), and networkd by default adds a host route to each of them via the AmpliFi. That sent
# everything eddings addressed to those IPs, including the monitoring role's WAN ping anchor, through
# the home router's NAT instead of out br-wan, so an AmpliFi hiccup read as WAN packet loss.
#
# The lease's DNS servers themselves stay configured on br-lan: when br-wan is unplugged for
# maintenance, eddings still resolves names through the LAN's default route.
[DHCPv4]
RoutesToDNS=no
