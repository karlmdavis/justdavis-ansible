---

##
# Removes the Tarsnap client that preceded restic (see the README: no automatic payment made it a
# hassle to keep going). The client, cache, and units are dead weight now, and the Tarsnap apt signing
# key expired on 2026-02-01, which makes `apt update` complain.
# Every task here is a no-op on hosts that never had Tarsnap.
#
# These tasks are transitional: once every managed host has run them, delete this file and its import
# (tracked in #111).
##

- name: Check Whether the Tarsnap Timer Exists
  ansible.builtin.stat:
    path: /etc/systemd/system/tarsnap-backups.timer
  register: offsite_backups_tarsnap_timer

- name: Stop the Tarsnap Timer and Service
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - tarsnap-backups.timer
    - tarsnap-backups.service
  when: offsite_backups_tarsnap_timer.stat.exists
  failed_when: false
  become: true

- name: Remove the Tarsnap Package
  ansible.builtin.apt:
    name: tarsnap
    state: absent
    purge: true
  become: true

# The source line was hand-edited on eddings to a `[signed-by=...]` form that no longer matches what the
# old role wrote, so the file is removed by name (it is the name apt_repository derives from the URL).
- name: Find Tarsnap APT Source Files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: 'pkg_tarsnap_com_*'
  register: offsite_backups_tarsnap_sources

- name: Remove Tarsnap APT Source Files and Keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (offsite_backups_tarsnap_sources.files | map(attribute='path') | list) + ['/etc/apt/keyrings/tarsnap.gpg'] }}"
  become: true

# The 2024 signing key also lives in the legacy global keyring on older hosts; `apt-key` is deprecated
# but is still the only way to remove entries from it.
- name: Check for the Tarsnap Key in the Legacy APT Keyring
  ansible.builtin.command:
    cmd: apt-key list 3058D169CA1EF173
  register: offsite_backups_tarsnap_legacy_key
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Remove the Tarsnap Key from the Legacy APT Keyring
  ansible.builtin.command:
    cmd: apt-key del 3058D169CA1EF173
  when: "'Tarsnap' in offsite_backups_tarsnap_legacy_key.stdout"
  become: true

# The key file (/root/tarsnap.key) is deliberately kept until we are certain the archives are unrecoverable
# or unneeded; see #111.
- name: Remove Tarsnap Units, Config, Script, and Cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/tarsnap-backups.timer
    - /etc/systemd/system/tarsnap-backups.service
    - /usr/local/bin/tarsnap-backups.sh
    - /etc/tarsnap.conf
    - /usr/local/tarsnap-cache
  become: true
  register: offsite_backups_tarsnap_removed

- name: Reload systemd After Removing the Tarsnap Units
  ansible.builtin.systemd:
    daemon_reload: true
  when: offsite_backups_tarsnap_removed.changed
  become: true
