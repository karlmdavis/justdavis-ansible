# Drop-in for the systemd-networkd unit that netplan generates for br-lan
# (/run/systemd/network/10-netplan-br-lan.network). Netplan has no key for this setting; networkd
# merges drop-ins from /etc into units that live in /run.
#
# The LAN router's DHCP lease names public resolvers as its DNS servers (1.1.1.1 and 1.0.0.1 as of
# 2026-10), and networkd by default adds a host route to each of them via the LAN router. That sent
# everything eddings addressed to those IPs, the monitoring role's WAN ping anchor included, through
# the LAN router's NAT instead of out br-wan, so a LAN router hiccup read as WAN packet loss.
#
# Only the routes go. The lease's DNS servers stay configured on br-lan, and eddings' resolver
# (systemd-resolved, using networkd's per-link servers) keeps using them. When br-wan is unplugged
# for maintenance, the lease's default route takes over (the ignore_routes_with_linkdown sysctl in
# /etc/sysctl.d/local.conf, from the same role), so name resolution keeps working through the LAN.
[DHCPv4]
RoutesToDNS=no
